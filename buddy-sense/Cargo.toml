[package]
name = "buddy-sense"
version = "0.1.0"
edition = "2021"
description = "A parallel multi-sensory nervous system feeding Code Buddy"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"

# Live screen capture is opt-in (xcap, X11/Wayland). The pure change detector
# builds + tests without it.
xcap = { version = "0.0.14", optional = true }
# Neural VAD (Silero via ONNX Runtime) is opt-in — ort auto-downloads onnxruntime
# at build; the energy-RMS VAD remains the default fallback.
# default-features off drops the `helpers` feature (libsamplerate/ebur128 C deps);
# we feed 16 kHz mono directly, no resampling needed.
vad-rs = { version = "0.1.4", optional = true, default-features = false }
# ort (ONNX Runtime) comes via vad-rs; pin it here only to enable a TLS backend so
# its download-binaries strategy can fetch onnxruntime at build (no system install).
ort = { version = "=2.0.0-rc.6", optional = true, features = ["load-dynamic", "ndarray"] }
# Pin ort-sys to match ort rc.6 (cargo otherwise resolves an incompatible rc.10).
ort-sys = { version = "=2.0.0-rc.6", optional = true }

# Live UI sense via AT-SPI (accessibility). zbus is pure-Rust D-Bus → no system
# deps. The pure mapper builds + tests without it.
atspi = { version = "0.30", optional = true, features = ["tokio"] }
# Non-optional: the thalamus merges the per-organ channels via StreamMap (organ isolation).
tokio-stream = "0.1"

# In-process STT (sherpa-onnx offline transducer) is opt-in behind `stt`. sherpa-rs's
# default `download-binaries` feature fetches the prebuilt sherpa-onnx + onnxruntime
# shared libs at build time → no C++ compile, no system install, no sudo.
# At RUNTIME the loader needs those .so on its path: they are copied next to the binary
# in target/<profile>/, so spawn the `stt` subcommand with LD_LIBRARY_PATH set to the
# binary's own directory (the TS worker does exactly this).
sherpa-rs = { version = "0.6.8", optional = true }

# Pocket TTS shares buddy-sense's existing `ort` 2.0.0-rc.6 pin (neural-vad).
# Two pre-release `ort` versions cannot coexist in one Cargo graph.
rand = { version = "0.8", optional = true }
ndarray = { version = "0.16", optional = true }
sentencepiece-model = { version = "0.1", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["fancy-regex"] }

[features]
default = []
# In-process offline STT (sherpa-onnx) — powers the `buddy-sense stt` subcommand.
stt = ["dep:sherpa-rs"]
# In-process Pocket TTS (Kyutai ONNX INT8) — powers `buddy-sense tts`.
# Reuses the crate's `ort` 2.0.0-rc.6 (same pin as neural-vad).
pocket-tts = ["dep:ort", "dep:ort-sys", "dep:rand", "dep:ndarray", "dep:sentencepiece-model", "dep:tokenizers"]
# Live-microphone sense (the robot's real-time ears): continuous ffmpeg `-f pulse`
# capture → streaming VAD endpointer → offline decode → `audio/transcript_final`.
# No `cpal`, no `libasound2-dev`, no sudo — reuses the system ffmpeg + `stt`.
live-audio = ["stt"]
# Live camera sense via ffmpeg (v4l2) — no extra crate, uses the system ffmpeg.
# The pure motion detector builds + tests without it.
live-vision = []
live-screen = ["dep:xcap"]
neural-vad = ["dep:vad-rs", "dep:ort", "dep:ort-sys"]
live-ui = ["dep:atspi"]
