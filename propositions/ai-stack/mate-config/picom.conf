# Configuration picom tear-free pour MATE via xrdp.
# Backend GLX + vsync = pas de tearing même en RDP.
# Inspirée des recos dedoimedo + Ubuntu MATE community.

#################################
#       Backend & VSync         #
#################################
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-copy-from-front = false;
use-damage = true;

#################################
#         Shadows               #
#################################
shadow = true;
shadow-radius = 8;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.30;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'plank'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#         Fading                #
#################################
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
  "100:class_g = 'plank'",
  "100:class_g = 'mate-panel'",
  "95:class_g = 'mate-terminal' && focused",
  "85:class_g = 'mate-terminal' && !focused"
];

#################################
#       Corners (rounded)       #
#################################
corner-radius = 6;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'plank'",
  "class_g = 'mate-panel'"
];

#################################
#         Misc                  #
#################################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
unredir-if-possible = false;

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};
