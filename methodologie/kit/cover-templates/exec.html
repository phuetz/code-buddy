<!--
Template cover exec — pour résumés exécutifs (3-5 pages, sans annexes).
Identique à principal.html mais avec un eyebrow "RÉSUMÉ EXÉCUTIF" et un sous-titre simplifié.
-->
<div class="cover-page">
  <div class="cover-eyebrow">RÉSUMÉ EXÉCUTIF — {{eyebrow}}</div>
  <h1 class="cover-title">{{title}}</h1>
  <div class="cover-subtitle">{{subtitle}}</div>
  <div class="cover-divider"></div>
  <div class="cover-meta">
    <strong>{{author}}</strong><br>
    {{date}} — {{version}}<br>
    <em>{{caption}}</em>
  </div>
  <div class="cover-foot">
    {{footer}}
  </div>
</div>
