<!--
Template cover compagnon — pour le doc compagnon roadmap (extrait du Q/R principal).
Placeholders identiques à principal.html, plus :
  {{principal_doc}} — référence vers la doc Q/R principale, ex. "Reponses-Questions-Impacts-v7.pdf"
-->
<div class="cover-page">
  <div class="cover-eyebrow">DOCUMENT COMPAGNON — {{eyebrow}}</div>
  <h1 class="cover-title">{{title}}</h1>
  <div class="cover-subtitle">{{subtitle}}<br>{{subtitle_b}}</div>
  <div class="cover-divider"></div>
  <div class="cover-meta">
    <strong>{{author}}</strong><br>
    {{date}} — {{version}}<br>
    <em>Document principal : {{principal_doc}}</em>
  </div>
  <div class="cover-foot">
    {{footer}}
  </div>
</div>
