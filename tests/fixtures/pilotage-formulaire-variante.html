<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Formulaire de démonstration</title>
<main>
  <h1>Inscription de démonstration</h1>
  <form class="nouveau-formulaire">
    <div class="commandes-deplacees"><button class="action-principale" type="button">Valider</button></div>
    <section><label for="adresse-contact">E-mail</label>
      <input id="adresse-contact" class="champ-contact" type="email" required></section>
  </form>
  <p role="status" aria-live="polite"></p>
</main>
<script>
  document.querySelector('button').addEventListener('click', () => {
    document.querySelector('[role="status"]').textContent =
      `Inscription validée : ${document.querySelector('input').value}`;
  });
</script>
</html>
