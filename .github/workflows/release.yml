name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Ensure npm supports OIDC trusted publishing
      run: |
        npm install -g npm@latest
        npm --version

    - name: Install dependencies
      run: npm ci

    - name: Rebuild native modules (better-sqlite3) for the runner ABI
      run: npm rebuild better-sqlite3

    # The full ~27K suite is no-mocks / real-integration (it needs live
    # Ollama / Hermes / a browser), so it cannot gate a release on a vanilla
    # GitHub runner — that brittleness is exactly why every tagged release
    # since v1.2 failed here and never published. Gate instead on the
    # deterministic checks that DO pass on a clean runner (type-check, lint,
    # build, the documented security audit gate) plus a fast core smoke. The
    # full env-dependent suite still runs in ci.yml.
    - name: Type check
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Security audit gate
      run: node scripts/ci-audit-gate.mjs

    - name: Smoke tests (deterministic core suites)
      run: npm test -- tests/fleet tests/kanban

    - name: Publish to npm
      run: npm publish --access public

    - name: Pack tarball
      run: npm pack

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Write release notes to a file
      # The body goes through a file, never through an argument: 2 200 commits between
      # v1.8.0 and v2.0.0 made the inline body exceed the OS argument limit
      # ("Argument list too long") and the release step died after npm had published.
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        NOTES="docs/RELEASE-NOTES-${VERSION}.md"
        {
          if [ -f "$NOTES" ]; then
            cat "$NOTES"
          else
            echo "## Changes in this release"
            echo
            git log "$(git describe --tags --abbrev=0 HEAD^)..HEAD" --pretty=format:"- %s (%h)" --no-merges | head -n 200
            echo
            echo "_Full history: see CHANGELOG.md._"
          fi
          echo
          echo "## Installation"
          echo
          echo '```bash'
          echo "npm install -g @phuetz/code-buddy@${VERSION}"
          echo '```'
          echo
          echo "or"
          echo
          echo '```bash'
          echo "npx @phuetz/code-buddy@${VERSION}"
          echo '```'
        } > "${RUNNER_TEMP}/release-body.md"
        wc -c "${RUNNER_TEMP}/release-body.md"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref }}
        name: Release ${{ steps.version.outputs.VERSION }}
        body_path: ${{ runner.temp }}/release-body.md
        draft: false
        prerelease: false
        files: phuetz-code-buddy-${{ steps.version.outputs.VERSION }}.tgz
