name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    - name: Validate tag matches package version
      run: |
        node --input-type=module <<'NODE'
        import fs from 'node:fs';
        const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
        const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
        const expected = `refs/tags/v${pkg.version}`;
        if (process.env.GITHUB_REF !== expected || lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) {
          throw new Error('Release tag, package.json and package-lock.json versions must match');
        }
        NODE

    - name: Ensure npm supports OIDC trusted publishing
      run: |
        npm install -g npm@latest
        npm --version

    - name: Install dependencies
      run: npm ci

    - name: Rebuild native modules (better-sqlite3) for the runner ABI
      run: npm rebuild better-sqlite3

    # Full tests gate the reviewed PR in ci.yml on Linux/macOS/Windows and Node20/22.
    # The tag workflow repeats build, lint, typecheck, audit and deterministic core
    # smoke checks before trusted publication. A tag must target that reviewed commit.
    - name: Type check
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

    - name: Security audit gate
      run: node scripts/ci-audit-gate.mjs

    - name: Smoke tests (deterministic core suites)
      run: npm test -- tests/fleet tests/kanban

    - name: Publish to npm
      run: npm publish --access public

    - name: Pack tarball
      run: npm pack

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Write release notes to a file
      # The body goes through a file, never through an argument: 2 200 commits between
      # v1.8.0 and v2.0.0 made the inline body exceed the OS argument limit
      # ("Argument list too long") and the release step died after npm had published.
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        NOTES="docs/RELEASE-NOTES-${VERSION}.md"
        {
          if [ -f "$NOTES" ]; then
            cat "$NOTES"
          else
            echo "## Changes in this release"
            echo
            git log "$(git describe --tags --abbrev=0 HEAD^)..HEAD" --pretty=format:"- %s (%h)" --no-merges | head -n 200
            echo
            echo "_Full history: see CHANGELOG.md._"
          fi
          echo
          echo "## Installation"
          echo
          echo '```bash'
          echo "npm install -g @phuetz/code-buddy@${VERSION}"
          echo '```'
          echo
          echo "or"
          echo
          echo '```bash'
          echo "npx @phuetz/code-buddy@${VERSION}"
          echo '```'
        } > "${RUNNER_TEMP}/release-body.md"
        wc -c "${RUNNER_TEMP}/release-body.md"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref }}
        name: Release ${{ steps.version.outputs.VERSION }}
        body_path: ${{ runner.temp }}/release-body.md
        draft: false
        prerelease: false
        files: phuetz-code-buddy-${{ steps.version.outputs.VERSION }}.tgz
