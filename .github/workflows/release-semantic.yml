name: Release (semantic-release)

# Manual, separate semantic-release route. The normal stable release procedure is
# the tag-triggered release.yml workflow; see docs/RELEASING.md.
# Do not execute both publishers for one version. The input remains dry-run by
# default. Any real use of this alternative needs its own reviewed plan and
# verification of npm authentication and current published versions.
# Published versions/tags, including v2.0.0, are immutable: never delete or move
# them to reset semantic-release's baseline. 2.0.0 is already published on npm.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (compute the next version without publishing)'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (also typechecks via tsc)
        run: npm run build

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi
