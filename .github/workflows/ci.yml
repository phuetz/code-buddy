name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prevent onnxruntime-node from downloading unused Linux CUDA 12 binaries
  # from api.nuget.org during npm ci; bundled CPU binaries are sufficient.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # All three operating systems are gating since 2026-09-08: the macOS and Windows
    # legs went green end-to-end (6/6 shards on Node 20 and 22) after the portability
    # campaign of that day, so they now block the merge like the Ubuntu legs.

    env:
      # Inherited by CLI subprocesses too; Vitest execArgv only caps its forks.
      NODE_OPTIONS: --max-old-space-size=${{ matrix.os == 'ubuntu-latest' && '8192' || '4096' }}
      # This suite remains mandatory, but gets a fresh parent on both Windows versions.
      # Repeated shard-4 runs lost its fork after 14 tests; native standalone 26/26 passed.
      SEMANTIC_SEARCH_SHARD_FILTER: ${{ matrix.os == 'windows-latest' && '--exclude=tests/unit/hybrid-search-semantic.test.ts' || '' }}

    strategy:
      # Never cancel the other legs when one fails — otherwise a non-Linux failure
      # cancels the still-running (and authoritative) Ubuntu legs, hiding whether
      # the blocking target actually passed.
      fail-fast: false
      matrix:
        # Supported CI toolchain versions; the runtime engine requirement is in package.json.
        node-version: [20.x, 22.x]
        # macOS runners sont facturés dix fois le tarif Linux, Windows deux fois.
        # Sur une pull request, la matrice se limite donc à Ubuntu — la cible
        # bloquante — et à Windows, où vivent de vraies différences de chemins et
        # d'arrêt de processus. macOS, non bloquant par construction
        # (continue-on-error ci-dessus), s'exécute à la fusion sur main et
        # develop, là où sa couverture sert encore à quelque chose.
        # Coût observé : environ 0,25 $ par pull request au lieu de 1 $.
        os: ${{ (github.event_name == 'pull_request' && fromJSON('["ubuntu-latest","windows-latest"]')) || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      env:
        # Authenticate the @vscode/ripgrep prebuilt download to avoid GitHub API
        # rate-limit 403s during postinstall on CI runners.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm ci

    - name: Install Chromium for blocking Ubuntu browser tests
      if: matrix.os == 'ubuntu-latest'
      run: npx playwright install --with-deps chromium

    - name: Rebuild native modules (better-sqlite3) for the CI Node ABI
      # Without this the better-sqlite3 .node binary often mismatches the runner's
      # Node version and the entire database test suite (~200 tests) is skipped.
      run: npm rebuild better-sqlite3

    - name: Run type check
      run: npm run typecheck

    - name: Run linter
      run: npm run lint

    - name: Build project
      run: npm run build

    - name: Run tests
      if: runner.os != 'Windows' && runner.os != 'macOS'
      run: npm test

    # Windows/macOS use six consecutive shards with fresh Vitest parents/forks.
    # A shared Windows fork has repeatedly exited without a failed assertion;
    # the native/process cause is not established. The isolated semantic suite
    # below remains a required step and is excluded only from Windows shards.
    # Linux keeps one invocation; no test is removed from any matrix entry.
    - name: Run semantic search in an isolated parent (Windows)
      if: matrix.os == 'windows-latest'
      run: npm test -- tests/unit/hybrid-search-semantic.test.ts

    - name: Run tests (shard 1/6)
      if: runner.os == 'Windows' || runner.os == 'macOS'
      # One retry for a worker exit; a second failure still fails the required job.
      run: npm test -- --shard=1/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }} || npm test -- --shard=1/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }}
    - name: Run tests (shard 2/6)
      if: runner.os == 'Windows' || runner.os == 'macOS'
      run: npm test -- --shard=2/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }} || npm test -- --shard=2/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }}
    - name: Run tests (shard 3/6)
      if: runner.os == 'Windows' || runner.os == 'macOS'
      run: npm test -- --shard=3/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }} || npm test -- --shard=3/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }}
    - name: Run tests (shard 4/6)
      if: runner.os == 'Windows' || runner.os == 'macOS'
      run: npm test -- --shard=4/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }} || npm test -- --shard=4/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }}
    - name: Run tests (shard 5/6)
      if: runner.os == 'Windows' || runner.os == 'macOS'
      run: npm test -- --shard=5/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }} || npm test -- --shard=5/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }}
    - name: Run tests (shard 6/6)
      if: runner.os == 'Windows' || runner.os == 'macOS'
      run: npm test -- --shard=6/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }} || npm test -- --shard=6/6 ${{ env.SEMANTIC_SEARCH_SHARD_FILTER }}

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.node-version == '20.x'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      env:
        # Authenticate the @vscode/ripgrep prebuilt download to avoid GitHub API
        # rate-limit 403s during postinstall on CI runners.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm ci

    - name: Run security audit (documented gate)
      # Blocks on any critical and on any undocumented high; documented highs live
      # in audit-allowlist.json with a rationale + expiry. Moderates/lows are tracked,
      # non-blocking. See scripts/ci-audit-gate.mjs.
      run: node scripts/ci-audit-gate.mjs

    - name: Run dependency check
      # Advisory only: depcheck has many false positives here (dynamic imports,
      # CI/test-only deps) and must not block a release — like the audit gate above.
      continue-on-error: true
      run: npx depcheck

  build-matrix:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      env:
        # Authenticate the @vscode/ripgrep prebuilt download to avoid GitHub API
        # rate-limit 403s during postinstall on CI runners.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm ci

    - name: Build
      run: npm run build

    - name: Package
      run: npm pack

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: '*.tgz'
